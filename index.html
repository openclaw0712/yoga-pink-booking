<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga Booking</title>
</head>
<body>
<h1 style="text-align:center">Yoga Booking System</h1>
<div id="app"></div>
<script>
var users = [];
var bookings = [];
var courses = [
  {id:1, name:'Morning Yoga', teacher:'Teacher A', time:'08:00-09:00', cap:10, booked:3},
  {id:2, name:'Yin Yoga', teacher:'Teacher B', time:'10:00-11:30', cap:8, booked:8},
  {id:3, name:'Hatha Yoga', teacher:'Teacher A', time:'14:00-15:30', cap:10, booked:5},
  {id:4, name:'Flow Yoga', teacher:'Teacher B', time:'16:00-17:00', cap:12, booked:2}
];
var currentUser = null;
var page = 'login';

function render() {
  var app = document.getElementById('app');
  if (page === 'login') {
    app.innerHTML = '<h2>Login</h2><input id="phone" placeholder="Phone"><input id="pw" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><button onclick="page=\'teacher\';render()">Teacher</button>';
  } else if (page === 'main') {
    var html = '<h2>Courses</h2><button onclick="logout()">Logout</button>';
    for (var i = 0; i < courses.length; i++) {
      var c = courses[i];
      var status = c.booked >= c.cap ? 'FULL' : 'AVAILABLE';
      html += '<div style="border:1px solid #ccc;padding:10px;margin:5px"><b>' + c.name + '</b><br>Teacher: ' + c.teacher + '<br>Time: ' + c.time + '<br>Status: ' + status + ' (' + c.booked + '/' + c.cap + ')</div>';
    }
    html += '<button onclick="page=\'my\';render()">My Bookings</button>';
    if (currentUser && currentUser.isTeacher) {
      html += '<button onclick="page=\'teacher\';render()">Teacher Panel</button>';
    }
    app.innerHTML = html;
  } else if (page === 'my') {
    var myBooks = [];
    for (var i = 0; i < bookings.length; i++) {
      if (bookings[i].phone === currentUser.phone) {
        myBooks.push(bookings[i]);
      }
    }
    var html = '<h2>My Bookings</h2><button onclick="page=\'main\';render()">Back</button>';
    if (myBooks.length === 0) {
      html += '<p>No bookings yet</p>';
    }
    for (var i = 0; i < myBooks.length; i++) {
      var b = myBooks[i];
      html += '<div style="border:1px solid #ccc;padding:10px;margin:5px"><b>' + b.courseName + '</b><br>Time: ' + b.time + '<br>Status: ' + b.status + '</div>';
    }
    app.innerHTML = html;
  } else if (page === 'teacher') {
    if (!currentUser || !currentUser.isTeacher) {
      currentUser = {phone:'teacher', name:'Teacher', isTeacher:true};
    }
    var html = '<h2>Teacher Panel</h2><button onclick="page=\'main\';render()">Back</button>';
    for (var i = 0; i < courses.length; i++) {
      var c = courses[i];
      html += '<div style="border:1px solid #ccc;padding:10px;margin:5px"><b>' + c.name + '</b><br>Teacher: ' + c.teacher + '<br>Booked: ' + c.booked + '/' + c.cap + '</div>';
    }
    html += '<button onclick="resetData()">Reset Demo Data</button>';
    app.innerHTML = html;
  }
}

function doLogin() {
  var phone = document.getElementById('phone').value.trim();
  var pw = document.getElementById('pw').value;
  for (var i = 0; i < users.length; i++) {
    if (users[i].phone === phone && users[i].pw === pw) {
      currentUser = users[i];
      page = 'main';
      render();
      return;
    }
  }
  alert('Login failed');
}

function logout() {
  currentUser = null;
  page = 'login';
  render();
}

function resetData() {
  courses = [
    {id:1, name:'Morning Yoga', teacher:'Teacher A', time:'08:00-09:00', cap:10, booked:3},
    {id:2, name:'Yin Yoga', teacher:'Teacher B', time:'10:00-11:30', cap:8, booked:8},
    {id:3, name:'Hatha Yoga', teacher:'Teacher A', time:'14:00-15:30', cap:10, booked:5},
    {id:4, name:'Flow Yoga', teacher:'Teacher B', time:'16:00-17:00', cap:12, booked:2}
  ];
  bookings = [];
  alert('Reset complete');
  render();
}

// Initial render
render();
document.write('<p>JS executed OK</p>');
</script>
</body>
</html>
