<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑜伽預約系統</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;background:#faf8f5;color:#333;min-height:100vh;font-size:16px}
.container{max-width:480px;margin:0 auto;padding:20px}
.logo{text-align:center;font-size:48px;margin-bottom:16px}
.title{text-align:center;font-size:26px;font-weight:700;color:#8b6f5c;margin-bottom:8px;letter-spacing:4px}
.subtitle{text-align:center;color:#888;margin-bottom:40px;font-size:14px}
.loading{text-align:center;padding:40px;color:#888}
.loading-spinner{width:40px;height:40px;border:3px solid #eee;border-top-color:#8b6f5c;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #eee}
.input-group{margin-bottom:12px}
.input-group input,.input-group select{width:100%;padding:12px 14px;border:2px solid #eee;border-radius:10px;font-size:15px}
.input-group input:focus,.input-group select:focus{outline:none;border-color:#8b6f5c}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn-primary{background:#8b6f5c;color:#fff}
.btn-secondary{background:#e8ddd4;color:#8b6f5c}
.btn-edit{background:#fff;color:#8b6f5c;border:2px solid #8b6f5c}
.btn-danger{background:#f8d7da;color:#721c24}
.btn-small{padding:8px 12px;font-size:13px;width:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;background:#fff;border:2px solid #8b6f5c;color:#8b6f5c;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.tab.active{background:#8b6f5c;color:#fff}
.error{color:#c67b5c;font-size:13px;margin-bottom:8px;text-align:center}
.success{color:#28a745;font-size:13px;margin-bottom:8px;text-align:center}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-title{font-size:16px;font-weight:700;color:#8b6f5c;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #e8ddd4}

.header h2{font-size:18px;font-weight:700;color:#8b6f5c}
.back-btn,.logout-btn{color:#8b6f5c;text-decoration:none;font-size:14px;cursor:pointer}
.day-title{font-size:15px;font-weight:700;color:#8b6f5c;padding:8px 12px;background:#f5f0eb;border-radius:10px;margin:20px 0 12px 0;border-top:3px solid #8b6f5c}
.course-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid #8b6f5c;cursor:pointer;transition:transform 0.15s}
.course-card:hover{transform:scale(1.01)}
.course-card.full{border-left-color:#e88b8b}
.capacity-bar{height:4px;background:#eee;border-radius:2px;margin-top:8px;overflow:hidden}
.capacity-fill{height:100%;border-radius:2px;transition:width 0.3s}
.cap-fill-green{background:#28a745}
.cap-fill-yellow{background:#f59e0b}
.cap-fill-red{background:#dc3545}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-ok{background:#d4edda;color:#155724}
.badge-full{background:#f8d7da;color:#721c24}
.badge-waiting{background:#fff3cd;color:#856404}
.badge-waitlist{background:#cce5ff;color:#004085}
.inline-form{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #ddd}
.inline-form.show{display:block}
.info-text{font-size:13px;color:#888;margin-top:4px}
.cloud-badge{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:8px}
.cloud-badge.on{background:#d4edda;color:#155724}
.cloud-badge.off{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div id="app" class="container"><div class="loading"><div class="loading-spinner"></div>連接雲端資料庫...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
// 全域變數
var weekdays=['週日','週一','週二','週三','週四','週五','週六'];
var CANCEL_LIMIT_HOURS=24;
var WAITLIST_SIZE=3;
var defaultCourses=[
  {id:1,name:'晨間瑜伽',teacher:'小美',time:'08:00-09:00',cap:10,booked:3,status:'active',weekday:1},
  {id:2,name:'陰瑜伽',teacher:'阿偉',time:'10:00-11:30',cap:8,booked:8,status:'active',weekday:2},
  {id:3,name:'哈達瑜伽',teacher:'小美',time:'14:00-15:30',cap:10,booked:5,status:'active',weekday:3},
  {id:4,name:'流動瑜伽',teacher:'阿偉',time:'16:00-17:00',cap:12,booked:2,status:'active',weekday:4},
  {id:5,name:'晚間冥想',teacher:'小美',time:'19:30-20:30',cap:15,booked:6,status:'active',weekday:5},
  {id:6,name:'哈達瑜伽',teacher:'阿偉',time:'09:00-10:30',cap:10,booked:4,status:'active',weekday:6},
  {id:7,name:'陰瑜伽',teacher:'小美',time:'14:00-15:30',cap:8,booked:7,status:'active',weekday:0}
];

var users=[];
var bookings=[];
var waitlist=[];
var courses=[];
var currentUser=null;
var page='login';
var selectedWeekday=new Date().getDay();
var isOnline=false;

// 雲端同步狀態
function setOnlineStatus(status){
  isOnline=status;
  var badge=document.querySelector('.cloud-badge');
  if(badge){
    badge.className='cloud-badge '+(status?'on':'off');
    badge.textContent=status?'☁️ 即時':'⚠️ 離線';
  }
}

// =============================================
// ClawBridge Proxy — 替換 Firebase Realtime Database
// =============================================
var CLOUD_API = 'https://clawbridge.myclawdomain.ccwu.cc/yoga/';

function ensureLocal(){
  localStorage.setItem('yoga_courses',JSON.stringify(courses));
  localStorage.setItem('yoga_users',JSON.stringify(users));
  localStorage.setItem('yoga_bookings',JSON.stringify(bookings));
  localStorage.setItem('yoga_waitlist',JSON.stringify(waitlist));
}

function restoreLocal(){
  var lc = JSON.parse(localStorage.getItem('yoga_courses')||'[]');
  if(lc.length > 0){
    courses = lc;
    users = JSON.parse(localStorage.getItem('yoga_users')||'[]');
    bookings = JSON.parse(localStorage.getItem('yoga_bookings')||'[]');
    waitlist = JSON.parse(localStorage.getItem('yoga_waitlist')||'[]');
    return true;
  }
  return false;
}

async function initData(){
  if(restoreLocal()){
    setOnlineStatus(false);
    render();
  }
  await syncFromCloud();
}

async function syncFromCloud(){
  try{
    var res = await fetch(CLOUD_API,{
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    if(!res.ok) throw new Error('Cloud fetch failed');
    var cloud = await res.json();
    if(cloud && cloud.courses){
      courses = cloud.courses || defaultCourses;
      users = cloud.users || [];
      bookings = cloud.bookings || [];
      waitlist = cloud.waitlist || [];
      setOnlineStatus(true);
      ensureLocal();
      render();
    }
  }catch(e){
    if(courses.length === 0){
      courses = defaultCourses;
      localStorage.setItem('yoga_courses',JSON.stringify(courses));
    }
    setOnlineStatus(false);
    render();
  }
}

async function saveToCloud(){
  ensureLocal();
  try{
    await fetch(CLOUD_API,{
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({courses:courses,users:users,bookings:bookings,waitlist:waitlist})
    });
  }catch(e){}
}


function loadOtherData(){
  ensureLocal();
  render();
}

// 離線本地儲存
function saveLocal(){
  localStorage.setItem('yoga_users',JSON.stringify(users));
  localStorage.setItem('yoga_bookings',JSON.stringify(bookings));
  localStorage.setItem('yoga_waitlist',JSON.stringify(waitlist));
  localStorage.setItem('yoga_courses',JSON.stringify(courses));
}

function save(){
  saveLocal();
  saveToCloud();
}

// 工具函數
function getNextClassDate(weekday,timeStr){
  var now=new Date();
  var daysUntil=(weekday-now.getDay()+7)%7;
  if(daysUntil===0){
    var parts=timeStr.split('-')[0].split(':');
    var classHour=parseInt(parts[0]);
    var classMin=parseInt(parts[1])||0;
    var classDate=new Date(now.getFullYear(),now.getMonth(),now.getDate(),classHour,classMin);
    if(classDate<=now)daysUntil=7;
  }
  var next=new Date(now);
  next.setDate(now.getDate()+daysUntil);
  return next;
}

function canCancel(booking){
  var c=getCourse(booking.courseId);
  if(!c)return false;
  var classDate=getNextClassDate(c.weekday,c.time);
  var now=new Date();
  var hoursLeft=(classDate-now)/(1000*60*60);
  return hoursLeft>=CANCEL_LIMIT_HOURS;
}

function getWaitlistCount(courseId){
  var count=0;
  for(var i=0;i<waitlist.length;i++)if(waitlist[i].courseId===courseId&&waitlist[i].status==='waiting')count++;
  return count;
}

function isInWaitlist(courseId){
  for(var i=0;i<waitlist.length;i++)if(waitlist[i].courseId===courseId&&waitlist[i].phone===currentUser.phone&&waitlist[i].status==='waiting')return true;
  return false;
}

function getWaitlistPosition(courseId,phone){
  var pos=0;
  for(var i=0;i<waitlist.length;i++){
    if(waitlist[i].courseId===courseId&&waitlist[i].status==='waiting'){
      pos++;
      if(waitlist[i].phone===phone)return pos;
    }
  }
  return pos;
}

function formatDateTime(date){
  return(date.getMonth()+1)+'/'+date.getDate()+' '+weekdays[date.getDay()]+' '+date.getHours()+':'+(date.getMinutes()<10?'0':'')+date.getMinutes();
}

// 渲染
function render(){
  var app=document.getElementById('app');
  if(page==='login'){app.innerHTML=getLoginHTML();animateLogin();}
  else if(page==='main'){app.innerHTML=getMainHTML();animateMain();}
  else if(page==='teacher'){app.innerHTML=getTeacherHTML();animateTeacher();}
  else if(page==='booking'){app.innerHTML=getBookingHTML();animatePage();}
  else if(page==='my'){app.innerHTML=getMyHTML();animatePage();}
}

function getLoginHTML(){
  return'<div class="logo">O</div><div class="title">瑜伽預約系統</div><div class="subtitle"><span class="cloud-badge '+(isOnline?'on':'off')+'">'+((isOnline)?'☁️ 即時同步':'⚠️ 離線模式')+'</span></div><div class="card"><div class="tabs"><div class="tab active" onclick="switchTab(this,\'login\')">登入</div><div class="tab" onclick="switchTab(this,\'reg\')">註冊</div></div><div id="tab-login"><div class="input-group"><input type="tel" id="phone" placeholder="電話號碼"></div><div class="input-group"><input type="password" id="pw" placeholder="密碼"></div><div class="error" id="err"></div><button class="btn btn-primary" onclick="doLogin()">登入</button></div><div id="tab-reg" style="display:none"><div class="input-group"><input type="text" id="name" placeholder="姓名"></div><div class="input-group"><input type="tel" id="rphone" placeholder="電話"></div><div class="input-group"><input type="password" id="rpw" placeholder="密碼"></div><div class="error" id="rerr"></div><button class="btn btn-primary" onclick="doRegister()">註冊</button></div></div><div class="card"><div style="text-align:center;color:#888;font-size:14px;margin-bottom:10px">老師專區</div><div id="teacherForm" style="display:none"><div class="input-group"><input type="password" id="teacherPw" placeholder="請輸入老師密碼"></div><button class="btn btn-primary" style="background:#5c8b6f" onclick="verifyTeacher()">確認</button></div><button class="btn" id="teacherBtn" style="background:#5c8b6f;color:#fff" onclick="showTeacherForm()">老師登入</button></div>';
}

function getMainHTML(){
  var html='<div class="header"><h2>瑜伽預約 <span class="cloud-badge '+(isOnline?'on':'off')+'">'+((isOnline)?'☁️':'⚠️')+'</span></h2><a href="#" class="logout-btn" onclick="logout()">登出</a></div>';
  html+='<div class="weekday-selector">';
  for(var i=0;i<7;i++){html+='<div class="weekday-btn'+(selectedWeekday===i?' active':'')+'" onclick="selectWeekday('+i+')"><span>'+weekdays[i].substring(1)+'</span></div>';}
  html+='</div>';
  
  var dayCourses=courses.filter(function(c){return c.weekday===selectedWeekday&&c.status==='active';});
  if(dayCourses.length===0){html+='<div class="card"><p style="text-align:center;color:#888">'+weekdays[selectedWeekday]+'沒有課程</p></div>';}
  else{
    html+='<div class="day-title">'+weekdays[selectedWeekday]+'課程</div>';
    for(var i=0;i<dayCourses.length;i++){
      var c=dayCourses[i];
      var pct=Math.round(c.booked/c.cap*100);
      var capClass='cap-fill-green';
      if(pct>=90)capClass='cap-fill-red';
      else if(pct>=70)capClass='cap-fill-yellow';
      var statusTxt='可預約';
      var cardClass='';
      if(c.booked>=c.cap){statusTxt='已額滿';cardClass=' full';}
      if(isInWaitlist(c.id)){statusTxt='候補中';cardClass=' waiting';}
      else if(hasBooked(c.id)){statusTxt='已預約';}
      var waitCount=getWaitlistCount(c.id);
      html+='<div class="course-card'+cardClass+'" onclick="goBooking('+c.id+')"><div style="font-weight:700;margin-bottom:4px">'+c.name+'</div><div style="color:#888;font-size:14px;margin-bottom:6px">'+c.teacher+' | '+c.time+'</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="badge '+(c.booked>=c.cap?'badge-full':'badge-ok')+'">'+statusTxt+'</span><span style="color:#888;font-size:13px">'+c.booked+'/'+c.cap+'</span>';
      if(waitCount>0)html+='<span class="badge badge-waitlist">候補'+waitCount+'人</span>';
      html+='</div><div class="capacity-bar"><div class="capacity-fill '+capClass+'" style="width:'+pct+'%"></div></div></div>';
    }
  }
  html+='<button class="btn btn-secondary" style="margin-top:16px" onclick="goMy()">我的預約</button>';
  return html;
}

function getTeacherHTML(){
  currentUser={id:0,name:'老師',phone:'teacher',isTeacher:true};
  var html='<div class="header"><h2>老師後台 <span class="cloud-badge '+(isOnline?'on':'off')+'">'+((isOnline)?'☁️ 即時':'⚠️ 離線')+'</span></h2><a href="#" class="logout-btn" onclick="logout()">登出</a></div>';
  html+='<div class="card"><div class="section-title">+ 新增課程</div>';
  html+='<div class="input-group"><input type="text" id="cname" placeholder="課程名稱"></div>';
  html+='<div style="display:flex;gap:8px"><div class="input-group" style="flex:1"><input type="text" id="cteacher" placeholder="老師"></div><div class="input-group" style="flex:1"><select id="cweekday"><option value="">星期</option><option value="0">週日</option><option value="1">週一</option><option value="2">週二</option><option value="3">週三</option><option value="4">週四</option><option value="5">週五</option><option value="6">週六</option></select></div></div>';
  html+='<div style="display:flex;gap:8px"><div class="input-group" style="flex:1"><input type="text" id="ctime" placeholder="09:00-10:00"></div><div class="input-group" style="flex:1"><input type="number" id="ccap" placeholder="名額" value="10"></div></div>';
  html+='<button class="btn btn-primary" onclick="addCourse()">新增課程</button></div>';
  
  for(var d=0;d<7;d++){
    var dayCourses=courses.filter(function(c){return c.weekday===d;});
    if(dayCourses.length===0)continue;
    html+='<div class="day-title">'+weekdays[d]+'</div>';
    for(var i=0;i<dayCourses.length;i++){
      var c=dayCourses[i];
      var pct=Math.round(c.booked/c.cap*100);
      var capClass='cap-fill-green';
      if(pct>=90)capClass='cap-fill-red';
      else if(pct>=70)capClass='cap-fill-yellow';
      var waitCount=getWaitlistCount(c.id);
      html+='<div class="card" style="border-left:4px solid #8b6f5c;margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:start"><div style="flex:1"><div style="font-weight:700;margin-bottom:4px">'+c.name+'<span style="color:#888;font-weight:400"> | '+c.time+'</span></div><div style="color:#888;font-size:13px;margin-bottom:6px">'+c.teacher+'</div><div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">報名：<b>'+c.booked+'/'+c.cap+'</b> ('+pct+'%)';
      if(waitCount>0)html+=' | <span style="color:#f59e0b">候補'+waitCount+'人</span>';
      html+='</div><div class="capacity-bar"><div class="capacity-fill '+capClass+'" style="width:'+pct+'%"></div></div></div>';
      html+='<div style="display:flex;gap:6px;margin-top:10px">';
      html+='<button class="btn btn-edit btn-small" onclick="showEditForm('+c.id+')">編輯</button>';
      if(c.status==='active')html+='<button class="btn btn-secondary btn-small" onclick="stopCourse('+c.id+')">停課</button>';
      else html+='<button class="btn btn-primary btn-small" onclick="restoreCourse('+c.id+')" style="background:#5c8b6f;color:#fff">復課</button>';
      html+='<button class="btn btn-danger btn-small" onclick="deleteCourse('+c.id+')">刪除</button></div>';
      html+='<div id="edit-'+c.id+'" class="inline-form"><div class="input-group"><input type="text" id="ename-'+c.id+'" value="'+c.name+'" placeholder="課程名稱"></div>';
      html+='<div style="display:flex;gap:8px;margin-bottom:8px"><div class="input-group" style="flex:1"><input type="text" id="eteacher-'+c.id+'" value="'+c.teacher+'" placeholder="老師"></div><div class="input-group" style="flex:1"><input type="text" id="etime-'+c.id+'" value="'+c.time+'" placeholder="時間"></div></div>';
      html+='<button class="btn btn-primary btn-small" onclick="saveEdit('+c.id+')" style="margin-top:8px">儲存</button>';
      html+='<button class="btn btn-secondary btn-small" onclick="hideEditForm('+c.id+')" style="margin-top:8px;margin-left:8px">取消</button></div></div>';
    }
  }
  
  var confirmed=bookings.filter(function(b){return b.status==='confirmed';});
  var waiting=waitlist.filter(function(w){return w.status==='waiting';});
  html+='<div class="card"><div class="section-title">報名學員 ('+confirmed.length+'人)</div>';
  if(confirmed.length===0)html+='<div style="color:#888;text-align:center;padding:20px">尚無報名</div>';
  for(var i=0;i<confirmed.length;i++){
    var b=confirmed[i];
    var c=getCourse(b.courseId);
    html+='<div style="padding:8px 0;border-bottom:1px solid #eee;font-size:14px"><b>'+b.name+'</b> | '+b.phone+'<br><span style="color:#888">'+(c?c.name+' ('+weekdays[c.weekday]+' '+c.time+')':'')+'</span></div>';
  }
  html+='</div>';
  
  if(waiting.length>0){
    html+='<div class="card"><div class="section-title">候補 ('+waiting.length+'人)</div>';
    for(var i=0;i<waiting.length;i++){
      var w=waiting[i];
      var c=getCourse(w.courseId);
      html+='<div style="padding:8px 0;border-bottom:1px solid #eee;font-size:14px"><b>'+w.name+'</b> | '+w.phone+'<br><span style="color:#888">'+(c?c.name+' ('+weekdays[c.weekday]+' '+c.time+')':'')+'</span></div>';
    }
    html+='</div>';
  }
  html+='<button class="btn btn-secondary" onclick="resetData()">恢復預設</button>';
  return html;
}

function getBookingHTML(){
  var c=getCourse(window.bookId);
  if(!c)return'<p>找不到課程</p><button class="btn btn-secondary" onclick="goMy()">返回</button>';
  var classDate=getNextClassDate(c.weekday,c.time);
  var spotsLeft=c.cap-c.booked;
  var isBooked=hasBooked(c.id);
  var inWait=isInWaitlist(c.id);
  var waitCount=getWaitlistCount(c.id);
  
  var html='<a href="#" class="back-btn" onclick="goMain()">- 返回</a>';
  html+='<div class="card" style="margin-top:12px">';
  html+='<div style="font-weight:700;font-size:18px;margin-bottom:8px">'+c.name+'</div>';
  html+='<div style="color:#888;margin-bottom:4px">'+c.teacher+'</div>';
  html+='<div style="color:#888;margin-bottom:4px">'+weekdays[c.weekday]+' '+c.time+'</div>';
  html+='<div style="color:#888;margin-bottom:12px">下次上課：'+formatDateTime(classDate)+'</div>';
  html+='<div style="margin-bottom:12px">名額：<b>'+c.booked+'/'+c.cap+'</b>（'+spotsLeft+'個名額）</div>';
  
  if(c.booked>=c.cap){
    if(inWait){
      html+='<div style="background:#fff3cd;color:#856404;padding:12px;border-radius:8px;text-align:center;margin-bottom:8px">您已在候補（第'+getWaitlistPosition(c.id,currentUser.phone)+'位）</div>';
      html+='<button class="btn btn-secondary" onclick="cancelWaitlist('+c.id+')">取消候補</button>';
    }else if(waitCount>=WAITLIST_SIZE){
      html+='<div style="background:#f8d7da;color:#721c24;padding:12px;border-radius:8px;text-align:center">候補已滿</div>';
    }else{
      html+='<div style="background:#fff3cd;color:#856404;padding:12px;border-radius:8px;margin-bottom:8px">目前額滿</div>';
      html+='<button class="btn btn-primary" style="background:#f59e0b" onclick="joinWaitlist('+c.id+')">加入候補（第'+waitCount+'位）</button>';
    }
  }else if(isBooked){
    html+='<div style="background:#cce5ff;color:#004085;padding:12px;border-radius:8px;text-align:center;margin-bottom:8px">您已預約</div>';
    var myBooking=getMyBookingByCourse(c.id);
    if(myBooking&&canCancel(myBooking)){
      html+='<button class="btn btn-danger" onclick="cancelBook('+myBooking.id+')">取消預約</button>';
      html+='<div class="info-text" style="margin-top:8px;text-align:center">可在課程前'+CANCEL_LIMIT_HOURS+'小時內取消</div>';
    }else{
      html+='<div style="background:#fff3cd;color:#856404;padding:12px;border-radius:8px;text-align:center">已超過取消期限</div>';
    }
  }else{
    html+='<button class="btn btn-primary" onclick="confirmBook('+c.id+')">確認報名</button>';
  }
  html+='</div>';
  return html;
}

function getMyHTML(){
  var my=getMyBookings();
  var myWait=getMyWaitlist();
  var html='<a href="#" class="back-btn" onclick="goMain()">- 返回</a><div class="header" style="margin-top:12px"><h2>我的預約</h2></div>';
  
  if(my.length===0&&myWait.length===0)html+='<div class="card"><p style="text-align:center;color:#888">尚無預約記錄</p></div>';
  
  for(var i=0;i<my.length;i++){
    var b=my[i];
    var c=getCourse(b.courseId);
    var classDate=c?getNextClassDate(c.weekday,c.time):null;
    html+='<div class="card"><div style="font-weight:700;margin-bottom:4px">'+b.courseName+'</div>';
    html+='<div style="color:#888;font-size:14px;margin-bottom:4px">'+(c?weekdays[c.weekday]+' '+c.time:'')+'</div>';
    if(c)html+='<div class="info-text">'+formatDateTime(classDate)+'</div>';
    if(b.status==='confirmed'){
      if(canCancel(b)){
        html+='<button class="btn btn-danger btn-small" style="margin-top:10px" onclick="cancelBook('+b.id+')">取消預約</button>';
      }else{
        html+='<div style="background:#fff3cd;color:#856404;padding:8px;border-radius:6px;font-size:13px;text-align:center;margin-top:8px">已超過取消期限</div>';
      }
    }else html+='<div style="color:#c67b5c;font-size:14px;margin-top:8px">已取消</div>';
    html+='</div>';
  }
  
  if(myWait.length>0){
    html+='<div class="day-title">候補中的課程</div>';
    for(var i=0;i<myWait.length;i++){
      var w=myWait[i];
      var c=getCourse(w.courseId);
      html+='<div class="card"><div style="font-weight:700;margin-bottom:4px">'+w.courseName+'</div>';
      html+='<div style="color:#888;font-size:14px;margin-bottom:4px">'+(c?weekdays[c.weekday]+' '+c.time:'')+'</div>';
      html+='<div style="background:#fff3cd;color:#856404;padding:8px;border-radius:6px;font-size:13px;text-align:center">第 '+getWaitlistPosition(w.courseId,w.phone)+' 順位</div>';
      html+='<button class="btn btn-secondary btn-small" style="margin-top:10px" onclick="cancelWaitlist('+w.courseId+')">取消候補</button></div>';
    }
  }
  return html;
}

// 取得函數
function getCourse(id){for(var i=0;i<courses.length;i++)if(courses[i].id===id)return courses[i];return null;}
function hasBooked(cid){for(var i=0;i<bookings.length;i++)if(bookings[i].courseId===cid&&bookings[i].phone===currentUser.phone&&bookings[i].status==='confirmed')return true;return false;}
function getMyBookingByCourse(cid){for(var i=0;i<bookings.length;i++)if(bookings[i].courseId===cid&&bookings[i].phone===currentUser.phone&&bookings[i].status==='confirmed')return bookings[i];return null;}
function getMyBookings(){var r=[];for(var i=0;i<bookings.length;i++)if(bookings[i].phone===currentUser.phone)r.push(bookings[i]);return r;}
function getMyWaitlist(){var r=[];for(var i=0;i<waitlist.length;i++)if(waitlist[i].phone===currentUser.phone&&waitlist[i].status==='waiting')r.push(waitlist[i]);return r;}

function selectWeekday(d){selectedWeekday=d;render();}

function switchTab(el,tab){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');document.getElementById('tab-login').style.display=tab==='login'?'block':'none';document.getElementById('tab-reg').style.display=tab==='reg'?'block':'none';}
function showTeacherForm(){document.getElementById('teacherForm').style.display='block';document.getElementById('teacherBtn').style.display='none';}
function verifyTeacher(){var pw=document.getElementById('teacherPw').value;if(pw==='yoga9527'){page='teacher';render();}else{toast('密碼錯誤','error');}}

function doLogin(){
  var phone=document.getElementById('phone').value.trim();
  var pw=document.getElementById('pw').value;
  for(var i=0;i<users.length;i++){if(users[i].phone===phone&&users[i].pw===pw){currentUser=users[i];page='main';render();return;}}
  document.getElementById('err').textContent='電話或密碼錯誤';
}

function doRegister(){
  var name=document.getElementById('name').value.trim();
  var phone=document.getElementById('rphone').value.trim();
  var pw=document.getElementById('rpw').value;
  if(!name||!phone||!pw){document.getElementById('rerr').textContent='請填寫所有欄位';return;}
  for(var i=0;i<users.length;i++){if(users[i].phone===phone){document.getElementById('rerr').textContent='此電話已註冊';return;}}
  var newUser={id:Date.now(),name:name,phone:phone,pw:pw,isTeacher:false};
  users.push(newUser);
  currentUser=newUser;
  save();
  toast('註冊成功');
  page='main';
  render();
}

function goMain(){page='main';render();}
function goMy(){page='my';render();}
function goBooking(id){window.bookId=id;page='booking';render();}

function showEditForm(id){var el=document.getElementById('edit-'+id);if(el){el.classList.add('show');gsap.from(el,{opacity:0,y:10,duration:0.3});}}
function hideEditForm(id){var el=document.getElementById('edit-'+id);if(el)el.classList.remove('show');}

function saveEdit(id){
  var c=getCourse(id);
  if(!c)return;
  var newName=document.getElementById('ename-'+id).value.trim();
  var newTeacher=document.getElementById('eteacher-'+id).value.trim();
  var newTime=document.getElementById('etime-'+id).value.trim();
  if(!newName||!newTeacher||!newTime){toast('請填寫完整','error');return;}
  c.name=newName;
  c.teacher=newTeacher;
  c.time=newTime;
  save();
  toast('已更新');
  hideEditForm(id);
  render();
}

function confirmBook(id){
  var c=getCourse(id);
  if(!c||c.booked>=c.cap){toast('已額滿','error');return;}
  if(hasBooked(id)){toast('已預約過','error');return;}
  c.booked++;
  bookings.push({id:Date.now(),phone:currentUser.phone,name:currentUser.name,courseId:id,courseName:c.name,teacher:c.teacher,time:c.time,weekday:c.weekday,status:'confirmed'});
  save();
  checkWaitlist(id);
  toast('報名成功');
  goMain();
}

function checkWaitlist(courseId){
  for(var i=0;i<waitlist.length;i++){
    if(waitlist[i].courseId===courseId&&waitlist[i].status==='waiting'){
      var c=getCourse(courseId);
      if(c&&c.booked<c.cap){
        c.booked++;
        waitlist[i].status='confirmed';
        bookings.push({id:Date.now(),phone:waitlist[i].phone,name:waitlist[i].name,courseId:waitlist[i].courseId,courseName:waitlist[i].courseName,teacher:waitlist[i].teacher,time:waitlist[i].time,weekday:waitlist[i].weekday,status:'confirmed'});
        save();
        toast('候補 '+waitlist[i].name+' 已確認');
        break;
      }
    }
  }
}

function joinWaitlist(id){
  var c=getCourse(id);
  if(!c)return;
  var waitCount=getWaitlistCount(id);
  if(waitCount>=WAITLIST_SIZE){toast('候補已滿','error');return;}
  if(isInWaitlist(id)){toast('已在候補名單','error');return;}
  waitlist.push({id:Date.now(),phone:currentUser.phone,name:currentUser.name,courseId:id,courseName:c.name,teacher:c.teacher,time:c.time,weekday:c.weekday,status:'waiting'});
  save();
  toast('已加入候補（第'+(waitCount+1)+'位）');
  goMy();
}

function cancelWaitlist(id){
  for(var i=0;i<waitlist.length;i++){
    if(waitlist[i].courseId===id&&waitlist[i].phone===currentUser.phone&&waitlist[i].status==='waiting'){
      waitlist[i].status='cancelled';
      save();
      toast('已取消');
      goMy();
      return;
    }
  }
}

function cancelBook(id){
  for(var i=0;i<bookings.length;i++){
    if(bookings[i].id===id){
      var b=bookings[i];
      var c=getCourse(b.courseId);
      if(c){
        var classDate=getNextClassDate(c.weekday,c.time);
        var hoursLeft=(classDate-new Date())/(1000*60*60);
        if(hoursLeft<CANCEL_LIMIT_HOURS){toast('已超過取消期限','error');return;}
        c.booked=Math.max(0,c.booked-1);
        checkWaitlist(b.courseId);
      }
      b.status='cancelled';
      break;
    }
  }
  save();
  toast('已取消');
  goMy();
}

function addCourse(){
  var name=document.getElementById('cname').value.trim();
  var teacher=document.getElementById('cteacher').value.trim();
  var time=document.getElementById('ctime').value.trim();
  var weekday=parseInt(document.getElementById('cweekday').value);
  var cap=parseInt(document.getElementById('ccap').value)||10;
  if(!name||!teacher||!time||isNaN(weekday)){toast('請填寫完整','error');return;}
  courses.push({id:Date.now(),name:name,teacher:teacher,time:time,cap:cap,booked:0,status:'active',weekday:weekday});
  save();
  document.getElementById('cname').value='';
  document.getElementById('cteacher').value='';
  document.getElementById('ctime').value='';
  document.getElementById('cweekday').value='';
  toast('課程已新增');
  render();
}

function stopCourse(id){var c=getCourse(id);if(!c)return;c.status='cancelled';save();toast('已停課');render();}
function restoreCourse(id){var c=getCourse(id);if(!c)return;c.status='active';save();toast('已復課');render();}
function deleteCourse(id){
  if(!confirm('確定刪除？'))return;
  courses=courses.filter(function(c){return c.id!==id;});
  bookings=bookings.filter(function(b){return b.courseId!==id;});
  waitlist=waitlist.filter(function(w){return w.courseId!==id;});
  save();
  toast('已刪除');
  render();
}

function resetData(){
  if(!confirm('確定恢復預設？'))return;
  courses=JSON.parse(JSON.stringify(defaultCourses));
  bookings=[];
  waitlist=[];
  save();
  toast('已恢復預設');
  render();
}

function logout(){currentUser=null;page='login';render();}

function toast(msg,type){
  type=type||'success';
  var el=document.createElement('div');
  el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:'+(type==='error'?'#dc3545':'#333')+';color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:1000;pointer-events:none';
  el.textContent=msg;
  document.body.appendChild(el);
  gsap.fromTo(el,{opacity:0,y:-20},{opacity:1,y:0,duration:0.3,onComplete:function(){gsap.to(el,{opacity:0,y:-20,delay:2,onComplete:function(){el.remove();}});}});
}

function animateLogin(){gsap.from('.card',{opacity:0,y:30,duration:0.5,stagger:0.15,delay:0.2,ease:'power2.out'});}
function animateMain(){gsap.from('.header',{opacity:0,duration:0.4,delay:0.1});gsap.from('.weekday-btn',{opacity:0,y:10,duration:0.3,stagger:0.05,delay:0.2});gsap.from('.course-card',{opacity:0,x:-30,duration:0.4,stagger:0.08,delay:0.4,ease:'power2.out'});}
function animateTeacher(){gsap.from('.header',{opacity:0,duration:0.4,delay:0.1});gsap.from('.card',{opacity:0,y:20,duration:0.4,stagger:0.1,delay:0.2,ease:'power2.out'});}
function animatePage(){gsap.from('.back-btn',{opacity:0,duration:0.3,delay:0.1});gsap.from('.header',{opacity:0,duration:0.4,delay:0.15});gsap.from('.card',{opacity:0,y:20,duration:0.4,stagger:0.1,delay:0.2,ease:'power2.out'});}

// 啟動
initData();
</script>
</body>
</html>
